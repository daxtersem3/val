server {
    listen 80;
    server_name localhost;

    # Gzip Compression for faster page loads (SEO ranking factor)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/ld+json
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Main SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache HTML pages briefly (for fresh content)
        add_header Cache-Control "public, max-age=300, s-maxage=600";
    }

    # Cache static assets aggressively (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|ico|svg|woff|woff2|ttf|eot|mp4)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Serve robots.txt and sitemap.xml directly
    location = /robots.txt {
        root /usr/share/nginx/html;
        add_header Content-Type "text/plain; charset=utf-8";
        access_log off;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        add_header Content-Type "application/xml; charset=utf-8";
        access_log off;
    }

    location = /site.webmanifest {
        root /usr/share/nginx/html;
        add_header Content-Type "application/manifest+json; charset=utf-8";
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
